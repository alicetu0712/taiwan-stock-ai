name: Hybrid Forward Shadow (Research)

# ── DEPLOYMENT STATUS ──────────────────────────────────────────────────────────
# STATUS: DEPLOYMENT READY — Option A (GitHub Actions artifact cache) configured.
#
# PERSISTENCE STRATEGY: Option A — GitHub Actions artifact cache
#   - data/platform.db is restored from cache at job start
#   - data/platform.db is saved back to cache after job completes
#   - Cache key includes run_id so each run creates a new cache entry
#   - restore-keys prefix match finds the most recent entry on next run
#   - Cache entries expire after 7 days of inactivity (GitHub default)
#   - Total cache size: data/platform.db < 50MB even after years of research data
#
# REMAINING BLOCKER FOR SCHEDULE ENABLE:
#   - Human approval required before uncommenting the schedule trigger below
#   - Run one manual workflow_dispatch first with confirm_persistence=YES
#   - Verify data/platform.db is restored correctly on the second manual run
#   - Then uncomment schedule and get approval
#
# SAFETY CONSTRAINTS:
#   - This workflow does NOT write to production Neon PostgreSQL.
#   - This workflow does NOT modify production ForwardSignals.
#   - This workflow does NOT trigger production deployments.
#   - This workflow does NOT modify MODEL_VERSION or trading thresholds.
#   - NEON_URL is not used anywhere in this workflow.
# ──────────────────────────────────────────────────────────────────────────────

on:
  # ── SCHEDULE IS COMMENTED OUT — PENDING HUMAN APPROVAL ───────────────────
  # Steps required before enabling:
  #   1. Run manually once with confirm_persistence=YES to seed the cache
  #   2. Run manually a second time to verify cache restore works
  #   3. Confirm consecutive_failures=0 after both runs
  #   4. Get explicit approval, then uncomment the block below
  #
  # schedule:
  #   # 台灣時間 15:35（收盤後）= UTC 07:35，週一至週五
  #   - cron: '35 7 * * 1-5'

  # Manual trigger (available now — use to test persistence)
  workflow_dispatch:
    inputs:
      trade_date:
        description: '交易日期 (YYYY-MM-DD)，留空表示今日'
        required: false
        type: string
      force_stale:
        description: '忽略 DailyPrice 新鮮度檢查（測試用）'
        required: false
        type: boolean
        default: false
      backfill_outcomes_only:
        description: '僅回填成熟 outcome，不新增 decision'
        required: false
        type: boolean
        default: false
      confirm_persistence:
        description: >
          確認本次執行為有意的正式操作（輸入 YES 才能繼續）。
          此 workflow 使用 GitHub Actions artifact cache 保存 data/platform.db。
          如果 cache 遺失，當日資料需手動補跑。
        required: true
        type: string

concurrency:
  group: hybrid-forward-shadow
  cancel-in-progress: false   # never cancel an in-flight shadow run

jobs:
  # ── 1. Persistence gate ────────────────────────────────────────────────────
  persistence-gate:
    name: Confirm Operation
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_persistence }}" != "YES" ]; then
            echo "❌ Operation not confirmed."
            echo ""
            echo "Re-run with confirm_persistence=YES to proceed."
            echo ""
            echo "PERSISTENCE: This workflow uses GitHub Actions artifact cache"
            echo "  (Option A) to persist data/platform.db between runs."
            echo ""
            echo "SAFETY: This workflow writes ONLY to research SQLite."
            echo "  Production Neon PostgreSQL is NEVER touched."
            exit 1
          fi
          echo "✅ Operation confirmed by operator"

  # ── 2. Main shadow runner ──────────────────────────────────────────────────
  run-hybrid-shadow:
    name: Hybrid Forward Shadow Runner
    runs-on: ubuntu-latest
    needs: persistence-gate
    timeout-minutes: 20

    env:
      PYTHONPATH: "."

    steps:
      # ── 2a. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2b. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 2c. Option A: Restore research database from cache ──────────────────
      # Uses separate restore/save steps to allow force-save on every run
      # (a cache hit with actions/cache@v4 combined would not re-save)
      - name: Restore research database from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/platform.db
          # Exact key won't match (includes run_id) → falls back to prefix
          key: hybrid-research-db-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hybrid-research-db-v1-${{ runner.os }}-

      - name: Report cache restore status
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache hit: data/platform.db restored from previous run"
          else
            echo "ℹ️ Cache miss: no previous data/platform.db found"
            echo "   This is expected on the first run."
            echo "   data/platform.db will be populated from repository if present."
          fi

      # ── 2d. Verify research DB ───────────────────────────────────────────────
      - name: Verify or initialise research database
        run: |
          if [ ! -f data/platform.db ]; then
            echo "⚠️ data/platform.db not found after cache restore."
            echo "   The database must be seeded with DailyPrice data."
            echo "   First-run: upload a seeded data/platform.db as an artifact,"
            echo "   or push it to the repository (note: .gitignore may exclude it)."
            echo "   This run will likely produce BLOCKED_STALE_DATA."
          else
            python3 -c "
          import sqlite3
          conn = sqlite3.connect('data/platform.db')
          tables = [r[0] for r in conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()]
          print(f'DB tables: {len(tables)} total')
          if 'daily_prices' in tables:
              r = conn.execute('SELECT MAX(date), COUNT(DISTINCT stock_id) FROM daily_prices WHERE stock_id=\"0050\"').fetchone()
              print(f'DailyPrice (0050): last={r[0]}, ok={r[0] is not None}')
          conn.close()
            "
          fi

      # ── 2e. Confirm NOT using production Neon ───────────────────────────────
      - name: Confirm research-only environment
        run: |
          python3 - <<'PYEOF'
          import os
          neon = os.environ.get("NEON_URL", "")
          research_pg = os.environ.get("RESEARCH_PG_URL", "")
          if neon:
              print(f"⚠️  NEON_URL is set in environment (len={len(neon)}).")
              print("    This workflow does NOT use it — research data goes to SQLite only.")
          if research_pg:
              print(f"ℹ️  RESEARCH_PG_URL is set — but Option A (SQLite) is active, not Option C.")
          print("✅ No production database writes in this workflow.")
          PYEOF

      # ── 2f. Run hybrid forward shadow ────────────────────────────────────────
      - name: Run Hybrid Forward Shadow
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.trade_date }}"
          fi

          FORCE_ARG=""
          if [ "${{ github.event.inputs.force_stale }}" == "true" ]; then
            FORCE_ARG="--force-stale"
          fi

          BACKFILL_ARG=""
          if [ "${{ github.event.inputs.backfill_outcomes_only }}" == "true" ]; then
            BACKFILL_ARG="--backfill-outcomes-only"
          fi

          python3 scripts/run_hybrid_forward_shadow.py $DATE_ARG $FORCE_ARG $BACKFILL_ARG

      # ── 2g. Run research tests ────────────────────────────────────────────────
      - name: Run research tests
        run: |
          python3 -m pytest \
            tests/test_hybrid_forward_shadow.py \
            tests/test_hybrid_entry_strategy.py \
            tests/test_storage_adapter.py \
            tests/test_cross_runner_persistence.py \
            -q --tb=short

      # ── 2h. Print operational summary ────────────────────────────────────────
      - name: Print operational summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import sqlite3, json, os
          if not os.path.exists("data/platform.db"):
              print("data/platform.db not found — no summary available")
          else:
              try:
                  conn = sqlite3.connect("data/platform.db")
                  from src.research.hybrid_forward_db import get_operational_summary
                  summary = get_operational_summary(conn)
                  conn.close()
                  print(json.dumps(summary, indent=2, default=str))
              except Exception as e:
                  print(f"Could not load summary: {e}")
          PYEOF

      # ── 2i. Option A: Save research database back to cache ───────────────────
      # Always save, even if the run was BLOCKED or SKIPPED (preserves DB state)
      - name: Save research database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/platform.db
          # Unique key per run so the latest run's DB is always findable
          key: hybrid-research-db-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Report cache save confirmation
        if: always()
        run: |
          echo "✅ data/platform.db saved to cache (key: hybrid-research-db-v1-${{ runner.os }}-${{ github.run_id }})"
          echo "   Next run will restore this exact file via restore-keys prefix match."
          if [ -f data/platform.db ]; then
            SIZE=$(du -sh data/platform.db | cut -f1)
            echo "   File size: $SIZE"
          fi
