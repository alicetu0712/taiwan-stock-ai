name: Daily Pipeline

# ── 觸發條件 ──────────────────────────────────────────────────
on:
  schedule:
    # 台灣時間 15:55（UTC+8）= UTC 07:55，週一至週五
    # 注意：GitHub Actions schedule 在高峰期可能延遲 15-30 分鐘。
    # 台股收盤 13:30，執行視窗距收盤仍有 2+ 小時緩衝，可接受。
    - cron: '55 7 * * 1-5'

  workflow_dispatch:
    inputs:
      trade_date:
        description: '交易日期 (YYYY-MM-DD)，留空表示今日'
        required: false
        type: string
      force:
        description: '強制執行（非交易日也執行，僅用於測試）'
        required: false
        type: boolean
        default: false

# ── 防止同一 workflow 重疊執行 ─────────────────────────────────
# cancel-in-progress: false → 前一個 run 仍在執行時，新 run 排隊等候。
# 每日 pipeline 寫入有 UniqueConstraint 保護，重跑同一交易日安全。
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Taiwan Stock AI — Daily Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 環境 ────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 3. 確認 DB 連線（快速失敗，不浪費 API quota）─────────
      - name: Verify Neon connection
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python - <<'PYEOF'
          import os, sys
          from sqlalchemy import create_engine, text

          url = os.environ.get("NEON_URL", "")
          if not url:
              print("ERROR: NEON_URL secret is not set", file=sys.stderr)
              sys.exit(1)

          url = url.replace("postgres://", "postgresql://", 1)
          engine = create_engine(url, connect_args={"sslmode": "require"})
          with engine.connect() as conn:
              result = conn.execute(text("SELECT current_database(), version()")).fetchone()
          print(f"Neon connection OK  db={result[0]}")

          # 確認不是 SQLite fallback
          assert "postgresql" in url, "URL is not PostgreSQL — DB selection logic error"
          PYEOF

      # ── 4. 執行 Pipeline ──────────────────────────────────────
      - name: Run daily pipeline
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # INPUT_DATE / INPUT_FORCE 從 workflow_dispatch inputs 帶入，
          # 用環境變數傳遞以避免 shell injection。
          INPUT_DATE: ${{ inputs.trade_date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "${INPUT_DATE}" ]; then
            # 基本格式驗證（YYYY-MM-DD）
            if ! echo "${INPUT_DATE}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "ERROR: trade_date must be YYYY-MM-DD, got: ${INPUT_DATE}" >&2
              exit 1
            fi
            ARGS="${ARGS} --date ${INPUT_DATE}"
          fi
          if [ "${INPUT_FORCE}" = "true" ]; then
            ARGS="${ARGS} --force"
          fi

          echo "Launching: python scripts/run_daily.py${ARGS}"
          python scripts/run_daily.py ${ARGS}

      # ── 5. 執行後正式驗收（Neon 寫入確認）────────────────────
      # 規則：
      #   交易日 pipeline 真正執行後，必須有可驗證的 execution_log。
      #   缺少必要紀錄時，本 step 必須 exit(1)。
      #   只有明確確認為非交易日跳過，才允許正常結束。
      - name: Post-run verification
        if: success()
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
          INPUT_DATE: ${{ inputs.trade_date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          python - <<'PYEOF'
          import os, sys
          from datetime import date
          from sqlalchemy import create_engine, text

          url = os.environ["NEON_URL"].replace("postgres://", "postgresql://", 1)
          engine = create_engine(url, connect_args={"sslmode": "require"})

          # Resolve the effective trade date using the SAME logic as run_daily.py.
          # If INPUT_DATE was explicitly provided, use it directly.
          # Otherwise, call effective_trade_date() so post-run verification
          # checks the same date the pipeline actually ran for.
          raw_date = os.environ.get("INPUT_DATE", "").strip()
          forced   = os.environ.get("INPUT_FORCE", "false").strip().lower() == "true"
          sys.path.insert(0, ".")
          if raw_date:
              today = date.fromisoformat(raw_date)
          else:
              from src.core.trading_calendar import effective_trade_date as _etd
              today = _etd()

          # 判斷是否為交易日
          from src.core.trading_calendar import is_trading_day as _is_td
          is_trading = _is_td(today) or forced

          print(f"Verification target date : {today}")
          print(f"Is trading day           : {is_trading}  (forced={forced})")

          with engine.connect() as conn:
              # ── execution_log 存在性檢查 ──────────────────────
              r = conn.execute(text(
                  "SELECT status, total_stocks, qualified_stocks, recommended_stocks, errors "
                  "FROM execution_logs WHERE date = :d ORDER BY id DESC LIMIT 1"
              ), {"d": today}).fetchone()

              if r is None:
                  if not is_trading:
                      print(f"Non-trading day {today} — pipeline correctly skipped. PASS")
                      sys.exit(0)
                  else:
                      # 交易日應有 execution_log；缺少代表寫入失敗
                      print(
                          f"ERROR: Trading day {today} but no execution_log found in Neon.",
                          file=sys.stderr,
                      )
                      print(
                          "Possible causes: sequence conflict, pipeline crashed before logging, "
                          "or NEON_URL points to wrong database.",
                          file=sys.stderr,
                      )
                      sys.exit(1)

              # ── execution_log 狀態檢查 ────────────────────────
              status, total, qualified, recs, errors = r
              print(f"execution_log  : status={status}  analyzed={total}  qualified={qualified}  recs={recs}")
              if errors:
                  print(f"  logged errors: {errors[:300]}")

              if status != "success":
                  print(f"ERROR: pipeline status={status!r} (expected 'success')", file=sys.stderr)
                  sys.exit(1)

              # ── analysis_results 寫入確認 ─────────────────────
              n_ar = conn.execute(text(
                  "SELECT COUNT(*) FROM analysis_results WHERE date = :d"
              ), {"d": today}).scalar()
              print(f"analysis_results [{today}]: {n_ar} rows")
              if n_ar == 0:
                  print("ERROR: analysis_results empty for today — write failed?", file=sys.stderr)
                  sys.exit(1)

              # ── forward_signals 寫入確認 ──────────────────────
              # n_fs=0 不代表失敗：gate L1-L3 正常拒絕或全 dedup 都回傳 0。
              # 真正的寫入失敗（DB exception）會使 execution_log.status="failed"，
              # 上方 status 檢查已攔截並 exit(1)。
              n_fs = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals WHERE trade_date = :d"
              ), {"d": today}).scalar()
              n_fs_valid = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals "
                  "WHERE trade_date = :d AND is_valid = true"
              ), {"d": today}).scalar()
              print(f"forward_signals [{today}]: total={n_fs}  valid={n_fs_valid}")
              if n_fs == 0 and is_trading:
                  print(
                      f"  NOTE: forward_signals=0 on trading day {today}. "
                      "Normal if L1-L3 gate rejected or all signals already exist (dedup). "
                      "Pipeline status=success confirms no DB write failure."
                  )

              # ── Neon 最新資料日期確認（防 DB 指向錯誤）──────────
              latest_ar = conn.execute(text(
                  "SELECT MAX(date) FROM analysis_results"
              )).scalar()
              print(f"Neon MAX(analysis_results.date): {latest_ar}")
              if str(latest_ar) != str(today):
                  print(
                      f"WARNING: Neon latest analysis_results date ({latest_ar}) "
                      f"!= expected ({today}). "
                      "If this is the first run after a long gap, "
                      "verify manually.",
                  )

              print(f"\nPost-run verification PASS  [{today}]")
          PYEOF
