name: Overnight Pipeline

# ── 觸發條件 ──────────────────────────────────────────────────
on:
  schedule:
    # 台灣時間 09:00（UTC+8）= UTC 01:00，週一至週五
    # 美股收盤 16:00 ET（UTC 20:00 / 21:00 DST）→ 此時已完整 5+ 小時
    # 台股開盤 09:00 TW → 在開盤前執行確保無 look-ahead bias
    - cron: '0 1 * * 1-5'

  workflow_dispatch:
    inputs:
      execution_date:
        description: 'execution_date (YYYY-MM-DD)，留空表示今日 TW'
        required: false
        type: string
      force:
        description: '強制執行（非交易日也執行，僅用於測試）'
        required: false
        type: boolean
        default: false

# ── 防止重疊（同日不重複執行）────────────────────────────────
concurrency:
  group: overnight-pipeline
  cancel-in-progress: false

jobs:
  run-overnight:
    name: Taiwan Stock AI — Overnight Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 環境 ────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 3. 確認 DB 連線 ──────────────────────────────────────
      - name: Verify Neon connection
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python - <<'PYEOF'
          import os, sys
          from sqlalchemy import create_engine, text

          url = os.environ.get("NEON_URL", "")
          if not url:
              print("ERROR: NEON_URL secret is not set", file=sys.stderr)
              sys.exit(1)

          url = url.replace("postgres://", "postgresql://", 1)
          engine = create_engine(url, connect_args={"sslmode": "require"})
          with engine.connect() as conn:
              result = conn.execute(text("SELECT current_database(), version()")).fetchone()
          print(f"Neon connection OK  db={result[0]}")
          assert "postgresql" in url, "URL is not PostgreSQL — DB selection logic error"
          PYEOF

      # ── 4. 執行盤前 Pipeline ──────────────────────────────────
      - name: Run overnight pipeline
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
          INPUT_DATE: ${{ inputs.execution_date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "${INPUT_DATE}" ]; then
            if ! echo "${INPUT_DATE}" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "ERROR: execution_date must be YYYY-MM-DD, got: ${INPUT_DATE}" >&2
              exit 1
            fi
            ARGS="${ARGS} --date ${INPUT_DATE}"
          fi
          if [ "${INPUT_FORCE}" = "true" ]; then
            ARGS="${ARGS} --force"
          fi

          echo "Launching: python scripts/run_overnight.py${ARGS}"
          python scripts/run_overnight.py ${ARGS}

      # ── 5. 執行後正式驗收 ────────────────────────────────────
      # 規則：
      #   交易日 pipeline 真正執行後，overnight_market_contexts 必須有當日紀錄。
      #   forward_signals 中未連結的訊號數目須回報（警告但不 fail）。
      #   只有明確確認為非交易日跳過，才允許正常結束。
      - name: Post-run verification
        if: success()
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
          INPUT_DATE: ${{ inputs.execution_date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          python - <<'PYEOF'
          import os, sys
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from sqlalchemy import create_engine, text

          TW  = ZoneInfo("Asia/Taipei")
          url = os.environ["NEON_URL"].replace("postgres://", "postgresql://", 1)
          engine = create_engine(url, connect_args={"sslmode": "require"})

          raw_date = os.environ.get("INPUT_DATE", "").strip()
          forced   = os.environ.get("INPUT_FORCE", "false").strip().lower() == "true"
          sys.path.insert(0, ".")
          if raw_date:
              exec_date = date.fromisoformat(raw_date)
          else:
              exec_date = datetime.now(TW).date()

          from src.core.trading_calendar import is_trading_day as _is_td
          is_trading = _is_td(exec_date) or forced

          print(f"Verification execution_date : {exec_date}")
          print(f"Is trading day              : {is_trading}  (forced={forced})")

          with engine.connect() as conn:

              # ── overnight_market_contexts 存在性檢查 ──────────
              ctx = conn.execute(text(
                  "SELECT id, risk_level, data_quality, us_market_date, retry_count "
                  "FROM overnight_market_contexts "
                  "WHERE execution_date = :d "
                  "ORDER BY id DESC LIMIT 1"
              ), {"d": exec_date}).fetchone()

              if ctx is None:
                  if not is_trading:
                      print(f"Non-trading day {exec_date} — overnight pipeline correctly skipped. PASS")
                      sys.exit(0)
                  else:
                      print(
                          f"ERROR: Trading day {exec_date} but no overnight_market_contexts "
                          "row found in Neon.",
                          file=sys.stderr,
                      )
                      print(
                          "Possible causes: Yahoo Finance fetch failed without graceful fallback, "
                          "or NEON_URL points to wrong database.",
                          file=sys.stderr,
                      )
                      sys.exit(1)

              ctx_id, risk_level, data_quality, us_date, retries = ctx
              print(
                  f"overnight_context: id={ctx_id}  risk={risk_level}  "
                  f"dq={data_quality}  us_date={us_date}  retries={retries}"
              )

              if data_quality == "UNKNOWN":
                  print(
                      f"WARNING: overnight context data_quality=UNKNOWN for {exec_date}. "
                      "Signals for this date will be excluded from the formal FOE cohort. "
                      "Check Yahoo Finance availability."
                  )

              # ── forward_signals 連結狀態 ──────────────────────
              n_total = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals WHERE execution_date = :d"
              ), {"d": exec_date}).scalar()

              n_linked = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals "
                  "WHERE execution_date = :d AND overnight_context_id = :cid"
              ), {"d": exec_date, "cid": ctx_id}).scalar()

              n_unlinked = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals "
                  "WHERE execution_date = :d AND overnight_rule_version IS NULL"
              ), {"d": exec_date}).scalar()

              print(
                  f"forward_signals [{exec_date}]: "
                  f"total={n_total}  linked={n_linked}  unlinked={n_unlinked}"
              )

              if n_unlinked > 0:
                  print(
                      f"WARNING: {n_unlinked} forward_signal(s) still unlinked for {exec_date}. "
                      "This may occur if the close pipeline ran after overnight pipeline. "
                      "Unlinked signals will be excluded from the formal FOE cohort."
                  )

              # ── FK integrity check ────────────────────────────
              bad_fk = conn.execute(text(
                  "SELECT COUNT(*) FROM forward_signals fs "
                  "WHERE fs.execution_date = :d "
                  "AND fs.overnight_context_id IS NOT NULL "
                  "AND NOT EXISTS ("
                  "  SELECT 1 FROM overnight_market_contexts omc "
                  "  WHERE omc.id = fs.overnight_context_id"
                  ")"
              ), {"d": exec_date}).scalar()

              if bad_fk > 0:
                  print(
                      f"ERROR: {bad_fk} forward_signal(s) have invalid overnight_context_id "
                      f"(FK broken) for {exec_date}.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              print(f"\nPost-run overnight verification PASS  [{exec_date}]")
          PYEOF
